name: content.json 검사
on:
  workflow_dispatch:   # Actions 탭에서 손으로 돌려 볼 수 있게
  push:
    paths: ['content.json', 'check.js']
  pull_request:
    paths: ['content.json', 'check.js']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node check.js
